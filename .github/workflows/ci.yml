name: ci

# push en cualquier rama, a propósito: la validación es el push de la rama,
# sin exigir un PR. pull_request queda sin filtro.
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buk_authz
      REDIS_URL: redis://localhost:6379
      TENANT_ID: demo-tenant
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buk_authz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buk_authz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: healthcheck
        run: npm run healthcheck
      - name: prisma generate
        run: npx prisma generate
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: migrate deploy
        run: npx prisma migrate deploy
      - name: db seed
        run: npm run db:seed
      - name: seed check
        run: |
          node --input-type=module <<'EOF'
          import pg from "pg";

          const checks = [
            ["SELECT count(*) FROM profiles", 8],
            ["SELECT count(*) FROM assets", 3],
          ];

          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            for (const [sql, expected] of checks) {
              const { rows } = await client.query(sql);
              const count = Number(rows[0].count);
              console.log(`${sql}; -- ${count}`);
              if (count !== expected) {
                throw new Error(`${sql} dio ${count}, se esperaba ${expected}`);
              }
            }
          } finally {
            await client.end();
          }
          EOF
      - name: test
        run: npm test
